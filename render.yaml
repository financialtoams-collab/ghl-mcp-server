# Render blueprint. In Render: New -> Blueprint -> point at this repo.
# Everything marked `sync: false` is filled in the dashboard, never committed.
services:
  - type: web
    name: ghl-mcp-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Free instances sleep after inactivity, which shows up as a slow first tool
    # call. Starter keeps it warm; move up only if you hit real load.
    plan: starter
    region: oregon
    healthCheckPath: /health
    autoDeploy: true

    # HighLevel rotates the agency refresh token on every exchange, so it must
    # outlive the container. Without this disk the filesystem is ephemeral and
    # every deploy or restart would silently require re-authorising the agency.
    # A disk also pins the service to one instance, which is what we want here:
    # two instances would race each other's rotations and both lose.
    disk:
      name: ghl-tokens
      mountPath: /var/data
      sizeGB: 1

    envVars:
      # Bearer token the MCP client must send. Render generates it; read it from
      # the dashboard once and paste it into the Claude connector setup.
      - key: MCP_AUTH_TOKEN
        generateValue: true

      # JSON map of sub-account alias -> locationId + Private Integration Token.
      # Set in the dashboard: it holds every CRM credential.
      #   {"solace":{"locationId":"...","token":"pit-..."}, "toams":{...}}
      - key: GHL_LOCATIONS
        sync: false

      # Which alias is used when a tool call names no location.
      - key: GHL_DEFAULT_LOCATION
        sync: false

      # --- Agency OAuth mode (for many or growing sub-accounts) ---------------
      # Set these INSTEAD OF GHL_LOCATIONS when one marketplace app installed on
      # the agency should cover every sub-account. New sub-accounts then work
      # with no config change at all.
      - key: GHL_CLIENT_ID
        sync: false
      - key: GHL_CLIENT_SECRET
        sync: false
      # Found in the marketplace app listing; required for ghl_list_locations.
      - key: GHL_APP_ID
        sync: false
      # Learned automatically from the first token exchange; set it to skip that.
      - key: GHL_COMPANY_ID
        sync: false
      # Where the rotated refresh token lives. Must be on the disk above.
      - key: GHL_TOKEN_STORE
        value: /var/data/ghl-tokens.json
      # Must match the Redirect URL registered on the marketplace app.
      - key: GHL_REDIRECT_URI
        sync: false
      # Optional nonce echoed back on the install callback.
      - key: GHL_INSTALL_STATE
        generateValue: true

      # Optional shared/agency token. Used for agency-level endpoints and as the
      # fallback for any GHL_LOCATIONS entry that omits its own token.
      - key: GHL_API_KEY
        sync: false

      # Dedicated tools loaded into the tool list. Keep this small: the meta-tools
      # reach all 576 endpoints on demand, so more modules here buys nothing but
      # context. See the README table for measured costs.
      - key: GHL_MODULES
        value: contacts,conversations,opportunities

      - key: GHL_ALLOW_WRITES
        value: "true"
      # Deletes stay off. Turn this on only deliberately, and never together with
      # a client that auto-approves tool calls.
      - key: GHL_ALLOW_DELETES
        value: "false"
      - key: GHL_META_TOOLS
        value: "true"

      # Render terminates TLS and forwards its own hostname; the server picks that
      # up from RENDER_EXTERNAL_HOSTNAME, so MCP_ALLOWED_HOSTS is only needed if
      # you put a custom domain in front.
      - key: MCP_BIND_HOST
        value: 0.0.0.0
